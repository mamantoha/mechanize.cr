name: Crystal CI

on:
  push:
  pull_request:

jobs:
  check_format:
    runs-on: ubuntu-latest
    steps:
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22.0"
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Check format
        run: crystal tool format --check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, crystal: "1.22.0"}
          - {os: ubuntu-latest, crystal: nightly}
          - {os: macos-latest, crystal: "1.22.0"}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: shards install
      - name: Run tests
        run: crystal spec
